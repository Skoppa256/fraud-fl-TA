# ============================================================================
# CENTRAL RESOURCE CONFIG — the ONLY place CPU/GPU allocation numbers live.
#
# Every model entry point loads its allocation from here via
# experiments/resources.py. There are NO built-in fallback values anywhere else:
# a missing or incomplete config is a CRASH, not a silent guess (this is what let
# creditcard.yaml's `auto` value escape a bare invocation previously). The sweep
# preflight (experiments/sweep_preflight.py) validates all of this before run 1.
#
# Decision 3: --gpu-fraction 1.0, fully sequential — one client actor at a time,
# which cannot OOM. 0.5 is available as an override but is not the default.
# ============================================================================

gpu_fraction_default: 1.0        # per-client GPU fraction for GPU models (sequential)
object_store_memory: 2147483648  # Ray object store per run: 2 GiB
threads_per_actor: 1             # pins OMP/MKL/OPENBLAS/torch threads per actor
min_vram_gib: 4                  # preflight aborts if any GPU has less free VRAM

# XGBoost compute device — explicit, never auto-detected. Used by the centralized
# XGBoost baseline (run_xgb) and by FedXGBllr's per-client XGBoost. Preflight
# downgrades `device` to cpu when no GPU is present.
xgboost:
  device: cuda
  tree_method: hist

# Per-model-family allocation. device: cpu|gpu; num_gpus is the per-client fraction.
# LR/SVM/GBM are CPU-only (num_gpus: 0.0) so they never block a GPU-needing actor.
models:
  lr:         {device: cpu, num_cpus: 2, num_gpus: 0.0}
  svm:        {device: cpu, num_cpus: 2, num_gpus: 0.0}
  gbm:        {device: cpu, num_cpus: 2, num_gpus: 0.0}
  ffd:        {device: gpu, num_cpus: 4, num_gpus: 1.0}
  bert_fraud: {device: gpu, num_cpus: 4, num_gpus: 1.0}
  fedxgbllr:  {device: gpu, num_cpus: 4, num_gpus: 1.0}
