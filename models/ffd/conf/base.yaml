model: ffd
num_clients: 5
num_rounds: 20
local_epochs: 5
batch_size: 80
lr: 0.01
random_seed: 42
oversampling: "smote"      # one of: smote, adasyn, none
sampling_strategy: 0.01  # imblearn sampling_strategy; "auto"=1:1, e.g. 0.01 for 1:100
use_wandb: false
wandb_project: "fraud-fl-TA"
early_stop_patience: 10
# NB: Ray CPU/GPU allocation (num_cpus/num_gpus per client) is NOT here — it lives
# solely in experiments/sweep_resources.yaml and is loaded via experiments.resources.
partition:
  scheme: iid
  alpha: null
